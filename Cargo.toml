[workspace]
resolver = "2"
members = ["core", "tui"]

[package]
name = "lyre"
version.workspace = true
edition.workspace = true

[[bin]]
name = "lyre"
path = "src/main.rs"

[dependencies]
lyre-core = { path = "core", default-features = false }
lyre-tui = { path = "tui", default-features = false }
color-eyre.workspace = true
ratatui.workspace = true

[features]
default = ["youtube", "gstreamer"]
youtube = ["lyre-tui/youtube", "lyre-core/youtube"]
gstreamer = ["lyre-tui/gstreamer", "lyre-core/gstreamer"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.10"
lofty = "0.24"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rayon = "1"
gstreamer = "0.25"
ratatui = "0.30"
crossterm = "0.29"
color-eyre = "0.6"
tempfile = "3"
fnv = "1"
unicode-width = "0.2"
yt-dlp = { version = "2.8.2", default-features = false, features = ["rustls", "cache-memory"] }
tokio = { version = "1", features = ["rt"] }

[profile.release]
opt-level = 3
debug = false
split-debuginfo = '...'
strip = "none"
debug-assertions = false
overflow-checks = false
lto = "thin"
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false
