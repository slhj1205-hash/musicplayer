[workspace]
resolver = "2"
members = ["core", "tui"]

[package]
name = "lyre"
version.workspace = true
edition.workspace = true

[[bin]]
name = "lyre"
path = "src/main.rs"

[dependencies]
lyre-core = { path = "core" }
lyre-tui = { path = "tui" }
color-eyre.workspace = true
ratatui.workspace = true

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.10"
lofty = "0.24"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rayon = "1"
gstreamer = "0.25"
ratatui = "0.30"
crossterm = "0.29"
color-eyre = "0.6"
tempfile = "3"
fnv = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
debug = false
split-debuginfo = '...'
strip = "none"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false
